name: cimvocabcheck-ci

on:
  pull_request:
    paths:
      - "cimvocabcheck/**"
      - "cimxml/**"
      - "pom.xml"
      - "scripts/generate-sbom.sh"
      - "scripts/check-sbom-licenses.py"
      - "scripts/sbom-license-overrides.json"
      - "scripts/compute-version.sh"
      - "scripts/set-versions.sh"
      - ".github/workflows/cimvocabcheck-ci.yml"
      - ".github/workflows/cimvocabcheck-release.yml"
      - ".github/workflows/docker-publish.yml"
  push:
    paths:
      - "cimvocabcheck/**"
      - "cimxml/**"
      - "pom.xml"
      - "scripts/generate-sbom.sh"
      - "scripts/check-sbom-licenses.py"
      - "scripts/sbom-license-overrides.json"
      - "scripts/compute-version.sh"
      - "scripts/set-versions.sh"
      - ".github/workflows/cimvocabcheck-ci.yml"
      - ".github/workflows/cimvocabcheck-release.yml"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read

concurrency:
  group: cimvocabcheck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Java lint -----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml
            cimvocabcheck/lsp/pom.xml

      # Treat any javac warning as a build error: unused imports, raw types,
      # deprecation, missing @Override, etc.
      - name: Lint — compiler warnings as errors
        run: |
          mvn -B -ntp -pl cimvocabcheck/core,cimvocabcheck/cli,cimvocabcheck/lsp -am \
            clean compile test-compile \
            -Dmaven.compiler.failOnWarning=true \
            -Dmaven.compiler.showWarnings=true \
            -Dmaven.compiler.showDeprecation=true

      # Static analysis + formatting gates (Spotless/google-java-format, Checkstyle,
      # SpotBugs, PMD/CPD). Tests and JaCoCo are skipped here for fast feedback — the
      # build-test job runs the full `verify` (including coverage gates) authoritatively.
      - name: Lint — static analysis (Spotless, Checkstyle, SpotBugs, PMD)
        run: |
          mvn -B -ntp -pl cimvocabcheck/core,cimvocabcheck/cli,cimvocabcheck/lsp -am \
            verify -DskipTests -Djacoco.skip=true

      # License-header gate for the whole Maven tree (root + cimvocabcheck aggregator
      # + core/cli/lsp poms). Java sources are covered by the Spotless step above;
      # this recursive mycila run additionally enforces the pom.xml headers, including
      # the aggregator poms that the -pl build above does not visit. cimxml is skipped
      # (its migration is staged). Autofix: scripts/license-headers.sh format
      - name: Lint — license headers (Maven)
        run: mvn -B -ntp com.mycila:license-maven-plugin:5.0.0:check

  # ---- Java build + tests --------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml
            cimvocabcheck/lsp/pom.xml

      # -pl with all three modules + -am also builds cimxml in dependency order.
      - name: Build and test all cimvocabcheck modules
        run: |
          mvn -B -ntp -pl cimvocabcheck/core,cimvocabcheck/cli,cimvocabcheck/lsp -am clean verify

  # ---- Python binding ------------------------------------------------------
  # The binding is a thin wrapper, so what needs guarding is the seam: that its generated model
  # still matches the published schema, and that a real engine answers the way the wrapper assumes.
  # It therefore builds the CLI fat JAR (analysis gates are the Java jobs' business) and points the
  # suite at it, with CIMVOCABCHECK_TESTS_REQUIRE_ENGINE turning "no engine, skipping" into a
  # failure so the engine-backed tests cannot silently stop running.
  python-binding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the binding and its tooling
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      # FAILS if the model no longer matches the schema it is generated from, i.e. someone
      # changed the report contract without regenerating. One generator serves every binding, so
      # this checks all three at once: python3 cimvocabcheck/bindings/codegen/generate_models.py
      - name: Verify every binding's generated model matches the published schema
        working-directory: .
        run: python3 cimvocabcheck/bindings/codegen/generate_models.py --check

      - name: Test against a real engine
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: python -m pytest

      # The run above only proves 3.13; this is the floor the package claims in requires-python.
      # No engine here (what differs between interpreters is the wrapper, not the engine) and the
      # container fallback is taken out of the way so the step cannot start pulling an image.
      - name: Setup the oldest supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Test on the oldest supported Python
        env:
          CIMVOCABCHECK_JAR: ""
          CIMVOCABCHECK_NO_DOCKER: "1"
        run: pip install -e ".[test]" && python -m pytest

  # ---- Rust binding --------------------------------------------------------
  # Rust is preinstalled on the runner image, so there is no toolchain action to pin here.
  rust-binding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # rustfmt covers the generated sources too: the generator emits formatted output so that
      # `--check` on either tool stays meaningful.
      - name: Format check
        run: cargo fmt -- --check

      - name: Test against a real engine
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: cargo test

      - name: Verify the crate packages
        run: cargo package --no-verify

  # ---- .NET binding --------------------------------------------------------
  dotnet-binding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Warnings are errors here (Directory.Build.props), so this is the lint gate too.
      - name: Build
        run: dotnet build --configuration Release

      - name: Test against a real engine
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: dotnet test --configuration Release --no-build

      - name: Verify the package builds
        run: dotnet pack src/Soptim.CimVocabCheck/Soptim.CimVocabCheck.csproj --configuration Release --no-build

  # ---- SBOM (maven) + license compliance -----------------------------------
  # Covers the Java library/CLI/LSP and their shipped Maven dependencies. The
  # CIMNotebook plugin SBOMs are generated/checked in cimnotebook-ci.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml
            cimvocabcheck/lsp/pom.xml

      # Regenerates cimvocabcheck/sbom/maven/{bom.json,THIRD-PARTY.txt}. FAILS here if any
      # dependency uses a license that is not on the reviewed open-source allow-list.
      - name: Generate maven SBOM + enforce license allow-list
        run: bash scripts/generate-sbom.sh maven

      # FAILS if the committed SBOMs / attribution no longer match the current
      # dependency set (i.e. someone changed deps without regenerating).
      - name: Verify committed SBOMs are up to date
        run: |
          if ! git diff --exit-code -- cimvocabcheck/sbom; then
            echo "::error::cimvocabcheck/sbom is out of date. Run 'scripts/generate-sbom.sh maven' and commit the result."
            exit 1
          fi

  # ---- Snapshot publish (main branch only) ---------------------------------
  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - build-test
      - sbom
      - python-binding
      - rust-binding
      - dotnet-binding
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java 21 for GitHub Packages
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compute and apply snapshot versions
        shell: bash
        run: |
          set -euo pipefail
          CIMXML_VERSION="$(bash scripts/compute-version.sh cimxml)"
          CIMVOCABCHECK_VERSION="$(bash scripts/compute-version.sh cimvocabcheck)"
          echo "cimxml: ${CIMXML_VERSION}, cimvocabcheck: ${CIMVOCABCHECK_VERSION}"
          bash scripts/set-versions.sh "${CIMXML_VERSION}" "${CIMVOCABCHECK_VERSION}"

      # cimxml must be installed locally before cimvocabcheck-core can resolve it.
      - name: Install cimxml SNAPSHOT into local repo
        run: mvn -B -ntp -f cimxml/pom.xml -DskipTests clean install

      # Only cimvocabcheck-core is a library artifact published to package registries.
      # cimvocabcheck-cli and cimvocabcheck-lsp are fat-JAR tools and are not deployed here.
      - name: Deploy cimvocabcheck-core snapshot to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -f cimvocabcheck/core/pom.xml clean deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}

  # ---- Edge Docker image (main only) ---------------------------------------
  # Publishes ghcr.io/<owner>/cimvocabcheck-cli:edge on every merge to main, so there is always a
  # fresh schema-less CLI image to test against. Remove this job if it adds too much main CI time;
  # the authoritative versioned images come from the release workflow.
  publish-edge-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - build-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag-suffixes: edge
