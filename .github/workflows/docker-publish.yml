name: docker-publish

# Reusable workflow that builds and pushes a CLI image to GHCR: the schema-less cimvocabcheck-cli
# image (called by cimvocabcheck-ci and cimvocabcheck-release) or the cimxml-cli image (called by
# cimxml-cli-ci and cimxml-cli-release). Edge image on main, versioned + latest on release.

on:
  workflow_call:
    inputs:
      component:
        description: "Image to build: 'cimvocabcheck' (cimvocabcheck-cli) or 'cimxml-cli'."
        required: false
        default: cimvocabcheck
        type: string
      tag-suffixes:
        description: "Newline-separated image tag suffixes (e.g. 'edge' or '1.2.3\\nlatest')."
        required: true
        type: string
      apply-versions:
        description: "Run scripts/set-versions.sh before building (release builds)."
        required: false
        default: false
        type: boolean
      cimxml-version:
        description: "cimxml version passed to set-versions.sh when apply-versions is true."
        required: false
        default: ""
        type: string
      release-version:
        description: "Release version for set-versions.sh and the image version label."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply release versions
        if: ${{ inputs.apply-versions }}
        shell: bash
        run: |
          if [ "${{ inputs.component }}" = "cimxml-cli" ]; then
            bash scripts/set-versions.sh "${{ inputs.cimxml-version }}" "" "" "${{ inputs.release-version }}"
          else
            bash scripts/set-versions.sh "${{ inputs.cimxml-version }}" "${{ inputs.release-version }}"
          fi

      - name: Compose image tags and labels
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${{ inputs.component }}" = "cimxml-cli" ]; then
            image="ghcr.io/${owner}/cimxml-cli"
            echo "dockerfile=cimxml-cli/Dockerfile" >> "${GITHUB_OUTPUT}"
          else
            image="ghcr.io/${owner}/cimvocabcheck-cli"
            echo "dockerfile=cimvocabcheck/Dockerfile" >> "${GITHUB_OUTPUT}"
          fi
          {
            echo "tags<<EOF"
            while IFS= read -r suffix; do
              [ -z "${suffix}" ] && continue
              echo "${image}:${suffix}"
            done <<< "${{ inputs.tag-suffixes }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "labels<<EOF"
            if [ -n "${{ inputs.release-version }}" ]; then
              echo "org.opencontainers.image.version=${{ inputs.release-version }}"
            fi
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
