name: cimvocabcheck-release

on:
  push:
    tags:
      - "cimvocabcheck-v*.*.*"

permissions:
  contents: read

concurrency:
  group: cimvocabcheck-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Validate tag and compute dependency versions ------------------------
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      cimxml_version: ${{ steps.validate.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and resolve cimxml dependency version
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^cimvocabcheck-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid tag format '${TAG}'. Expected cimvocabcheck-vX.Y.Z" >&2
            exit 1
          fi

          RELEASE_VERSION="${TAG#cimvocabcheck-v}"

          # Find the last cimxml release tag to use as the dependency version.
          # Maven Central rejects SNAPSHOT references, so we always pin to a release.
          CIMXML_TAG="$(git tag --sort=-version:refname --list 'cimxml-v*' | head -1)"
          if [[ -z "${CIMXML_TAG}" ]]; then
            echo "No cimxml release tag found. At least one cimxml-vX.Y.Z tag is required." >&2
            exit 1
          fi
          CIMXML_VERSION="${CIMXML_TAG#cimxml-v}"

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "cimxml_version=${CIMXML_VERSION}" >> "${GITHUB_OUTPUT}"

  # ---- Maven Central (cimvocabcheck-core only) -----------------------------
  publish-maven-central:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: Maven Central Deployment
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CENTRAL_PORTAL_USERNAME}" ]] || (echo "CENTRAL_PORTAL_USERNAME is missing" >&2; exit 1)
          [[ -n "${CENTRAL_PORTAL_PASSWORD}" ]] || (echo "CENTRAL_PORTAL_PASSWORD is missing" >&2; exit 1)
          [[ -n "${MAVEN_GPG_PASSPHRASE}"    ]] || (echo "MAVEN_GPG_PASSPHRASE is missing"    >&2; exit 1)

      - name: Setup Java 21 + Maven Central auth + GPG
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
          server-id: central
          server-username: CENTRAL_PORTAL_USERNAME
          server-password: CENTRAL_PORTAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Apply release versions
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Install cimxml release into local repo
        run: mvn -B -ntp -f cimxml/pom.xml -DskipTests clean install

      - name: Publish cimvocabcheck-core to Maven Central
        run: mvn -B -ntp -f cimvocabcheck/core/pom.xml -Pcentral-release clean deploy

  # ---- GitHub Packages (cimvocabcheck-core release) ------------------------
  publish-github-packages-release:
    needs:
      - validate-tag
      - publish-maven-central
    if: always() && needs.validate-tag.result == 'success' && (needs.publish-maven-central.result == 'success' || needs.publish-maven-central.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21 for GitHub Packages
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Apply release versions
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Install cimxml release into local repo
        run: mvn -B -ntp -f cimxml/pom.xml -DskipTests clean install

      - name: Publish cimvocabcheck-core release to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -f cimvocabcheck/core/pom.xml -DskipTests clean deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}

  # ---- GitHub Release with binary artifacts (core / cli / lsp jars) --------
  publish-release-assets:
    needs:
      - validate-tag
      - publish-maven-central
    if: always() && needs.validate-tag.result == 'success' && (needs.publish-maven-central.result == 'success' || needs.publish-maven-central.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml
            cimvocabcheck/lsp/pom.xml

      - name: Apply release versions
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Install cimxml and cimvocabcheck-core into local repo
        run: |
          mvn -B -ntp -f cimxml/pom.xml -DskipTests clean install
          mvn -B -ntp -f cimvocabcheck/core/pom.xml -DskipTests clean install

      - name: Build CLI fat JAR
        run: mvn -B -ntp -f cimvocabcheck/cli/pom.xml -DskipTests clean package

      - name: Build LSP fat JAR
        run: mvn -B -ntp -f cimvocabcheck/lsp/pom.xml -DskipTests clean package

      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CIMVocabCheck ${{ env.RELEASE_VERSION }}" \
            --generate-notes \
            --draft \
            "cimvocabcheck/core/target/cimvocabcheck-core-${{ env.RELEASE_VERSION }}.jar" \
            "cimvocabcheck/cli/target/cimvocabcheck-cli-${{ env.RELEASE_VERSION }}.jar" \
            "cimvocabcheck/lsp/target/cimvocabcheck-lsp-${{ env.RELEASE_VERSION }}.jar"

  # ---- Language bindings ---------------------------------------------------
  # One job and one GitHub environment per registry. All three use OIDC trusted publishing:
  # the job proves its identity to the registry with a short-lived GitHub token and receives a
  # credential that expires in minutes, so there is no long-lived API token stored anywhere.
  #
  # The environment is part of that identity — each registry's trusted-publisher policy names
  # this repository, this workflow file and the environment below, so a run from any other
  # workflow, or the same workflow outside the environment, cannot mint a credential. Requiring
  # a reviewer on the environment therefore gates the publish itself, not just the job.
  #
  # id-token: write is what lets the job request that GitHub token; job-level permissions
  # replace the workflow default rather than adding to it, so contents: read is repeated.
  #
  # They depend only on validate-tag: a binding ships no Java, so it is not blocked by a Maven
  # Central outage — same reasoning as the Docker image job.
  #
  # Each one rebuilds the engine from this tag and re-runs that binding's suite against it
  # before publishing. A tag can point at a commit CI never saw, and none of these registries
  # lets you take a version back.

  # ---- PyPI (cimvocabcheck) ------------------------------------------------
  publish-pypi:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment:
      name: PyPI Deployment
      url: https://pypi.org/project/cimvocabcheck/${{ needs.validate-tag.outputs.release_version }}/
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/python
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Apply release versions
        working-directory: .
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the binding and its tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" build==1.6.1 twine==7.0.0

      # FAILS if the tag carries a model that no longer matches the schema it is generated from.
      - name: Verify the generated model matches the published schema
        working-directory: .
        run: python3 cimvocabcheck/bindings/codegen/generate_models.py --check

      - name: Test against the engine from this tag
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: python -m pytest

      - name: Build the distributions
        run: python -m build --outdir dist .

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      # Trusted publishing: no credential is passed in, the action mints one from this job's
      # OIDC identity. It also attaches PEP 740 attestations by default. skip-existing so
      # re-running a release that failed half way is safe. packages-dir is relative to the
      # workspace, not to this job's working-directory, which applies only to `run` steps.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: cimvocabcheck/bindings/python/dist
          skip-existing: true

  # ---- NuGet (Soptim.CimVocabCheck) ----------------------------------------
  publish-nuget:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment:
      name: NuGet Deployment
      url: https://www.nuget.org/packages/Soptim.CimVocabCheck/${{ needs.validate-tag.outputs.release_version }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/dotnet
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not a credential — the NuGet.org account whose trusted-publishing policy this run has
      # to match. Checked here so a missing variable fails by name rather than inside the
      # token exchange.
      - name: Validate required configuration
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          [[ -n "${NUGET_USER}" ]] || (echo "repository variable NUGET_USER is missing" >&2; exit 1)

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Apply release versions
        working-directory: .
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Warnings are errors here (Directory.Build.props), so this is the lint gate too.
      - name: Build
        run: dotnet build --configuration Release

      - name: Test against the engine from this tag
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Soptim.CimVocabCheck/Soptim.CimVocabCheck.csproj \
            --configuration Release --no-build --output artifacts

      # Exchanges this job's OIDC identity for a short-lived NuGet API key.
      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate so re-running a release that failed half way is safe.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate

  # ---- crates.io (cimvocabcheck) -------------------------------------------
  publish-crates-io:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment:
      name: crates.io Deployment
      url: https://crates.io/crates/cimvocabcheck/${{ needs.validate-tag.outputs.release_version }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cimvocabcheck/bindings/rust
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimvocabcheck/core/pom.xml
            cimvocabcheck/cli/pom.xml

      - name: Apply release versions
        working-directory: .
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "${RELEASE_VERSION}"

      - name: Build the CLI fat JAR to test against
        working-directory: .
        run: |
          mvn -B -ntp -pl cimvocabcheck/cli -am package \
            -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true \
            -Dpmd.skip=true -Dcpd.skip=true -Dlicense.skip=true -Dspotless.check.skip=true
          echo "CIMVOCABCHECK_JAR=$(ls "${GITHUB_WORKSPACE}"/cimvocabcheck/cli/target/cimvocabcheck-cli-*.jar)" >> "${GITHUB_ENV}"

      # Rust is preinstalled on the runner image, so there is no toolchain action to pin here.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Test against the engine from this tag
        env:
          CIMVOCABCHECK_TESTS_REQUIRE_ENGINE: "1"
        run: cargo test

      # crates.io has no --skip-duplicate, so ask first; that makes re-running a release that
      # failed half way safe, and means no credential is minted when there is nothing to push.
      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if curl -sf -o /dev/null -H "User-Agent: opencgmes-release" \
              "https://crates.io/api/v1/crates/cimvocabcheck/${RELEASE_VERSION}"; then
            echo "cimvocabcheck ${RELEASE_VERSION} is already on crates.io; nothing to publish."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # Exchanges this job's OIDC identity for a crates.io token that expires in minutes.
      - name: Authenticate to crates.io
        if: steps.published.outputs.exists == 'false'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # --allow-dirty because set-versions.sh stamps the version into Cargo.toml at build time:
      # versions in this repository are derived from tags and are never committed.
      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --allow-dirty

  # ---- Public Docker image (GitHub Container Registry) ---------------------
  # Schema-less CLI image: users mount their own schema + inputs. Built from source so it does not
  # depend on the release-asset job; only needs the resolved versions from validate-tag.
  publish-docker-image:
    needs: validate-tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag-suffixes: |
        ${{ needs.validate-tag.outputs.release_version }}
        latest
      apply-versions: true
      cimxml-version: ${{ needs.validate-tag.outputs.cimxml_version }}
      release-version: ${{ needs.validate-tag.outputs.release_version }}
