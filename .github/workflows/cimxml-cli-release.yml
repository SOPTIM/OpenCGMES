name: cimxml-cli-release

on:
  push:
    tags:
      - "cimxml-cli-v*.*.*"

permissions:
  contents: read

concurrency:
  group: cimxml-cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Validate tag and compute dependency versions ------------------------
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      cimxml_version: ${{ steps.validate.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate tag and resolve cimxml dependency version
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^cimxml-cli-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid tag format '${TAG}'. Expected cimxml-cli-vX.Y.Z" >&2
            exit 1
          fi

          RELEASE_VERSION="${TAG#cimxml-cli-v}"

          # The release builds against the last cimxml release, never a SNAPSHOT.
          CIMXML_TAG="$(git tag --sort=-version:refname --list 'cimxml-v*' | head -1)"
          if [[ -z "${CIMXML_TAG}" ]]; then
            echo "No cimxml release tag found. At least one cimxml-vX.Y.Z tag is required." >&2
            exit 1
          fi
          CIMXML_VERSION="${CIMXML_TAG#cimxml-v}"

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "cimxml_version=${CIMXML_VERSION}" >> "${GITHUB_OUTPUT}"

  # ---- GitHub Release with the distribution ZIP and the fat JAR ------------
  # No Maven Central / GitHub Packages: cimxml-cli is a tool, not a library.
  publish-release-assets:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
      CIMXML_VERSION: ${{ needs.validate-tag.outputs.cimxml_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            cimxml/pom.xml
            cimxml-cli/pom.xml

      - name: Apply release versions
        run: bash scripts/set-versions.sh "${CIMXML_VERSION}" "" "" "${RELEASE_VERSION}"

      - name: Install cimxml into local repo
        run: mvn -B -ntp -f cimxml/pom.xml -DskipTests clean install

      - name: Build fat JAR and distribution ZIP
        run: mvn -B -ntp -f cimxml-cli/pom.xml -DskipTests clean package

      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "cimxml2jsonld ${{ env.RELEASE_VERSION }}" \
            --generate-notes \
            --draft \
            "cimxml-cli/target/cimxml-cli-${{ env.RELEASE_VERSION }}.zip" \
            "cimxml-cli/target/cimxml-cli-${{ env.RELEASE_VERSION }}.jar"

  # ---- Docker image (GitHub Container Registry) ----------------------------
  publish-docker-image:
    needs: validate-tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      component: cimxml-cli
      tag-suffixes: |
        ${{ needs.validate-tag.outputs.release_version }}
        latest
      apply-versions: true
      cimxml-version: ${{ needs.validate-tag.outputs.cimxml_version }}
      release-version: ${{ needs.validate-tag.outputs.release_version }}
